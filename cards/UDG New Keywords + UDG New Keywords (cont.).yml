  name: UDG New Keywords (cont.)
  rulesText: >-
    *Mourn*: Whenever a creature card is put into your graveyard, you gain 1
    life.

    *Ravage*: It can deal excess combat damage to another creature defending
    player controls.

    *Riposte*: Whenever it is dealt damage by another creature, it deals that
    much damage back.

    *Retreat:* Whenever it becomes blocked, you may return it to its owner's
    hand.

    *Rush [N]*: You may cast it for N less. At the beginning of your next
    upkeep, sacrifice it unless you pay N.

    *Sleeper*: It can't attack unless it is modified.

    *Zeal*: Whenever you cast a creature spell, it gets +1/+1 until end of turn.
