  name: UDG New Keywords
  rulesText: >
    *Barrier [cost]*: If a source would deal damage to this creature, prevent
    that damage unless that source's controller pays [cost]. 

    *Bulwark*: Can block an additional creature.

    *Climbing*: Can't be blocked by creatures with greater toughness.

    *Deathlink*: Whenever it deals combat damage, target player loses that much
    life.

    *Escort*: Whenever it attacks, target creature without escort can't be
    blocked this turn.

    *Grind*: Whenever it deals combat damage, target player mills that many
    cards.

    *Nullify*: Whenever it blocks or becomes blocked by a creature, that
    creature loses all abilities until end of combat.
